    <text class="mono" x="584.4" y="28.8" font-size="10.5" font-weight="700" letter-spacing=".3" fill="#f19db7">Groq</text>
  </g>
  <g class="chip" style="animation-delay:0.40s">
    <rect x="634" y="6" width="181" height="38" rx="8" fill="url(#bg)" stroke="#f3b66e" stroke-opacity=".32"/>
    <circle class="dot" style="animation-delay:1.40s" cx="650" cy="25.0" r="3" fill="#f3b66e"/>
    <text class="mono" x="661" y="28.8" font-size="10.5" letter-spacing=".3" fill="#787882">frontend</text>
    <text class="mono" x="728.0" y="28.8" font-size="10.5" font-weight="700" letter-spacing=".3" fill="#f3b66e">HTML/CSS/JS</text>
