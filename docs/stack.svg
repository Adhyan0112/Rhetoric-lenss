<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 821 50" width="821" height="50" role="img" aria-label="Built with FastAPI, WebSockets, Deepgram, Groq and plain HTML, CSS and JavaScript" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Stack: FastAPI, WebSockets, Deepgram, Groq, plain HTML/CSS/JS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15181e"/><stop offset="1" stop-color="#0c0e12"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .chip{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    .dot{animation:blink 2.4s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g class="chip" style="animation-delay:0.00s">
    <rect x="6" y="6" width="147" height="38" rx="8" fill="url(#bg)" stroke="#72f5c5" stroke-opacity=".32"/>
    <circle class="dot" style="animation-delay:0.00s" cx="22" cy="25.0" r="3" fill="#72f5c5"/>
    <text class="mono" x="33" y="28.8" font-size="10.5" letter-spacing=".3" fill="#787882">backend</text>
    <text class="mono" x="93.30000000000001" y="28.8" font-size="10.5" font-weight="700" letter-spacing=".3" fill="#72f5c5">FastAPI</text>
  </g>
  <g class="chip" style="animation-delay:0.10s">
    <rect x="163" y="6" width="147" height="38" rx="8" fill="url(#bg)" stroke="#a9edce" stroke-opacity=".32"/>
    <circle class="dot" style="animation-delay:0.35s" cx="179" cy="25.0" r="3" fill="#a9edce"/>
    <text class="mono" x="190" y="28.8" font-size="10.5" letter-spacing=".3" fill="#787882">live</text>
    <text class="mono" x="230.2" y="28.8" font-size="10.5" font-weight="700" letter-spacing=".3" fill="#a9edce">WebSockets</text>
  </g>
  <g class="chip" style="animation-delay:0.20s">
    <rect x="320" y="6" width="147" height="38" rx="8" fill="url(#bg)" stroke="#9685ff" stroke-opacity=".32"/>
    <circle class="dot" style="animation-delay:0.70s" cx="336" cy="25.0" r="3" fill="#9685ff"/>
    <text class="mono" x="347" y="28.8" font-size="10.5" letter-spacing=".3" fill="#787882">speech</text>
    <text class="mono" x="400.6" y="28.8" font-size="10.5" font-weight="700" letter-spacing=".3" fill="#9685ff">Deepgram</text>
  </g>
  <g class="chip" style="animation-delay:0.30s">
    <rect x="477" y="6" width="147" height="38" rx="8" fill="url(#bg)" stroke="#f19db7" stroke-opacity=".32"/>
    <circle class="dot" style="animation-delay:1.05s" cx="493" cy="25.0" r="3" fill="#f19db7"/>
