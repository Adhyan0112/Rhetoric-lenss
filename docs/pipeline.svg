<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-labelledby="t d">
  <title id="t">RhetoricLens analysis pipeline</title>
  <desc id="d">Input flows through transcription, a 30 second context window, a classifier, server-side verification and scoring, then to the dashboard.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".01"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:Manrope,'Segoe UI',ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif}
    .box{fill:url(#card);stroke:#eeece1;stroke-opacity:.16;stroke-width:1}
    .lit{fill:#72f5c5;fill-opacity:0;stroke:#72f5c5;stroke-width:1.4;stroke-opacity:0;animation:lit 7.2s ease-in-out infinite}
    .flow{fill:none;stroke:#72f5c5;stroke-opacity:.7;stroke-width:1.6;stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
    .head{fill:#72f5c5;animation:head 7.2s ease-in-out infinite}
    .n1{animation-delay:0s}.n2{animation-delay:1.2s}.n3{animation-delay:2.4s}.n4{animation-delay:3.6s}.n5{animation-delay:4.8s}.n6{animation-delay:6s}
    @keyframes lit{0%{fill-opacity:0;stroke-opacity:0}4%{fill-opacity:.09;stroke-opacity:.9}16%{fill-opacity:.04;stroke-opacity:.55}24%,100%{fill-opacity:0;stroke-opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-20}}
    @keyframes head{0%{opacity:0}4%{opacity:1}20%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.lit{stroke-opacity:0;fill-opacity:0}.head{opacity:0}}
  </style>
  <rect width="1280" height="230" rx="18" fill="#090a0d"/>

  <!-- connectors (box width 160, gap 48, margin 40) -->
  <g>
    <path class="flow" d="M200 115H240"/><path class="flow" d="M408 115H448"/><path class="flow" d="M616 115H656"/>
    <path class="flow" d="M824 115H864"/><path class="flow" d="M1032 115H1072"/>
  </g>

  <!-- nodes -->
  <g transform="translate(40 66)"><rect class="box" width="160" height="98" rx="6"/><rect class="lit n1" width="160" height="98" rx="6"/>
    <text class="mono" x="16" y="26" font-size="10" letter-spacing="2" fill="#a9edce">01</text>
    <text class="sans" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-.4" fill="#f1f0e9">Listen</text>
    <text class="mono" x="16" y="76" font-size="10.5" fill="#9b9ba5">Mic · file · text</text></g>
  <g transform="translate(248 66)"><rect class="box" width="160" height="98" rx="6"/><rect class="lit n2" width="160" height="98" rx="6"/>
    <text class="mono" x="16" y="26" font-size="10" letter-spacing="2" fill="#a9edce">02</text>
    <text class="sans" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-.4" fill="#f1f0e9">Transcribe</text>
    <text class="mono" x="16" y="76" font-size="10.5" fill="#9b9ba5">Deepgram · EN / HI</text></g>
  <g transform="translate(456 66)"><rect class="box" width="160" height="98" rx="6"/><rect class="lit n3" width="160" height="98" rx="6"/>
    <text class="mono" x="16" y="26" font-size="10" letter-spacing="2" fill="#a9edce">03</text>
    <text class="sans" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-.4" fill="#f1f0e9">Context</text>
    <text class="mono" x="16" y="76" font-size="10.5" fill="#9b9ba5">30 s rolling window</text></g>
  <g transform="translate(664 66)"><rect class="box" width="160" height="98" rx="6"/><rect class="lit n4" width="160" height="98" rx="6"/>
    <text class="mono" x="16" y="26" font-size="10" letter-spacing="2" fill="#a9edce">04</text>
    <text class="sans" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-.4" fill="#f1f0e9">Classify</text>
    <text class="mono" x="16" y="76" font-size="10.5" fill="#9b9ba5">Groq · six fallacies</text></g>
  <g transform="translate(872 66)"><rect class="box" width="160" height="98" rx="6"/><rect class="lit n5" width="160" height="98" rx="6"/>
    <text class="mono" x="16" y="26" font-size="10" letter-spacing="2" fill="#f19db7">05</text>
    <text class="sans" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-.4" fill="#f1f0e9">Verify + score</text>
    <text class="mono" x="16" y="76" font-size="10.5" fill="#9b9ba5">Server owns the score</text></g>
  <g transform="translate(1080 66)"><rect class="box" width="160" height="98" rx="6"/><rect class="lit n6" width="160" height="98" rx="6"/>
    <text class="mono" x="16" y="26" font-size="10" letter-spacing="2" fill="#a9edce">06</text>
    <text class="sans" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-.4" fill="#f1f0e9">Show</text>
    <text class="mono" x="16" y="76" font-size="10.5" fill="#9b9ba5">Flag · timeline</text></g>

  <text class="mono" x="640" y="208" text-anchor="middle" font-size="10" letter-spacing="2.4" fill="#787882">THE CLASSIFIER PROPOSES · THE SERVER DECIDES</text>
</svg>
